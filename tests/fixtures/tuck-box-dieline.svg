<?xml version="1.0" encoding="UTF-8"?>
<!-- straight tuck-end box: panels 15 glue | 60 front | 40 side | 60 back | 40 side, body 120 high, flaps 40 -->
<svg xmlns="http://www.w3.org/2000/svg" width="215mm" height="200mm" viewBox="0 0 215 200">
  <g id="Cut">
    <path d="M0 45 L15 40 L15 40 L75 40 L75 0 L135 0 L135 40 L175 40 L175 40 L215 40 L215 160 L175 160 L175 200 L115 200 L115 160 L75 160 L15 160 L0 155 Z" fill="none" stroke="#ff0000" stroke-width="0.25"/>
  </g>
  <g id="Crease">
    <line x1="15" y1="40" x2="15" y2="160" stroke="#00a000" stroke-dasharray="2 1"/>
    <line x1="75" y1="40" x2="75" y2="160" stroke="#00a000" stroke-dasharray="2 1"/>
    <line x1="115" y1="40" x2="115" y2="160" stroke="#00a000" stroke-dasharray="2 1"/>
    <line x1="175" y1="40" x2="175" y2="160" stroke="#00a000" stroke-dasharray="2 1"/>
    <line x1="75" y1="40" x2="135" y2="40" stroke="#00a000" stroke-dasharray="2 1"/>
    <line x1="115" y1="160" x2="175" y2="160" stroke="#00a000" stroke-dasharray="2 1"/>
  </g>
  <g id="Glue"><rect x="0" y="45" width="15" height="110" fill="none" stroke="#999"/></g>
  <g id="Dimensions"><text x="10" y="10">60 x 40 x 120</text></g>
</svg>
