# ONE-CLICK RELEASE — Actions → «Publish release» → Run workflow (choose patch / minor / major and a short title).
#   1. turns «## Unreleased» in CHANGELOG.md into the new version and sets package.json (scripts/release-prep.mjs)
#   2. commits «Release X.Y.Z» to main and starts CI on it
#   3. waits for ci-ok — publishes the tag + GitHub Release ONLY when it is green (notes = that changelog section)
#   4. a server with `bash scripts/autoupdate.sh on` installs it by itself within 10 minutes
# Refuses when main is already red, when «Unreleased» is empty, or when the version exists.
name: Publish release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'نوع الإصدار: patch = إصلاحات · minor = مميزات جديدة · major = تغيير كبير'
        type: choice
        options: [minor, patch, major]
        default: minor
      title:
        description: 'عنوان قصير للإصدار (اختياري)'
        type: string
        required: false
concurrency:
  group: publish-release
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
  checks: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: main must be green before releasing
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          c=$(gh api "repos/$GITHUB_REPOSITORY/commits/$(git rev-parse HEAD)/check-runs" --jq '[.check_runs[]|select(.name=="ci-ok")|.conclusion][0] // "none"')
          echo "ci-ok on main: $c"
          [ "$c" = success ] || { echo "::error::main is not green (ci-ok=$c) — fix it before releasing"; exit 1; }
      - name: Next version
        id: v
        run: |
          cur=$(node -p "require('./package.json').version")
          IFS=. read -r MA MI PA <<< "$cur"
          case "${{ inputs.bump }}" in major) MA=$((MA+1)); MI=0; PA=0;; minor) MI=$((MI+1)); PA=0;; *) PA=$((PA+1));; esac
          v="$MA.$MI.$PA"; echo "version=$v" >> "$GITHUB_OUTPUT"; echo "$cur → $v"
          git rev-parse -q --verify "refs/tags/v$v" >/dev/null && { echo "::error::tag v$v already exists"; exit 1; } || true
      - name: Prepare (changelog + package.json)
        env: { TITLE: '${{ inputs.title }}' }
        run: node scripts/release-prep.mjs "${{ steps.v.outputs.version }}" "$TITLE"
      - name: Commit to main and start CI on it
        id: c
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qam "Release ${{ steps.v.outputs.version }}"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # a push made with GITHUB_TOKEN does not trigger workflows — start CI explicitly for this commit
          gh workflow run ci.yml --ref main
      - name: Wait for ci-ok (green) on the release commit
        env: { GH_TOKEN: '${{ github.token }}', SHA: '${{ steps.c.outputs.sha }}' }
        run: |
          for i in $(seq 1 100); do
            s=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" --jq '[.check_runs[]|select(.name=="ci-ok")|.conclusion][0] // "pending"' 2>/dev/null || echo pending)
            [ "$s" = null ] && s=pending
            echo "ci-ok: $s"; [ "$s" = success ] && exit 0
            [ "$s" != pending ] && { echo "::error::CI failed on the release commit — nothing was published. The version commit stays on main; fix and run again with the next version."; exit 1; }
            sleep 30
          done
          echo "::error::CI did not finish in 50 minutes — nothing was published"; exit 1
      - name: Publish tag + GitHub Release
        env: { GH_TOKEN: '${{ github.token }}', SHA: '${{ steps.c.outputs.sha }}' }
        run: |
          V="${{ steps.v.outputs.version }}"
          awk -v v="$V" '$0 ~ "^## "v"( |$)" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          TITLE="v$V — $(sed -n "s/^## $V — \(.*\)$/\1/p" CHANGELOG.md | head -1)"
          gh release create "v$V" --target "$SHA" --title "$TITLE" --notes-file notes.md
          {
            echo "### ✅ نُشر الإصدار v$V"
            echo "- الإصدار: https://github.com/$GITHUB_REPOSITORY/releases/tag/v$V"
            echo "- السيرفر مع التحديث التلقائي (\`bash scripts/autoupdate.sh on\`) يثبّته خلال 10 دقائق."
            echo "- بدون التحديث التلقائي: \`cd /opt/future-creative && git pull && bash scripts/update.sh\`"
          } >> "$GITHUB_STEP_SUMMARY"
