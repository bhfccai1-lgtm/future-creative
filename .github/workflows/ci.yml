# Quality gate for every push / pull request. A green ✓ on the commit = safe to run `bash scripts/update.sh` on the server.
#   build        — clean `npm ci`, typecheck, unit tests, production build (lint included)
#   integration  — the full integration suite against real PostgreSQL 16 + Redis 7, split over 3 parallel runners
#   ci-ok        — one summary check (green only when every job above is green) — scripts/update.sh waits for it
#   docker       — builds the exact production image the server builds (catches Dockerfile / dependency breaks)
#   + a weekly run on main (catches intermittent tests and outside drift before an update depends on it)
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 23 * * 6' # Sunday 02:17 Bahrain
concurrency:
  group: ci-${{ github.ref }}
  # a newer push to a PR replaces its run; on main every commit finishes, so every commit gets a real ✓ / ✗ (never «cancelled»)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - name: FFmpeg (reels/audio, same as the Docker image)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit -- --reporter=default --reporter=github-actions
      - name: Production build (same as the Docker image, includes lint)
        run: npm run build

  integration:
    name: integration (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: fc, POSTGRES_PASSWORD: fc, POSTGRES_DB: fcap_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fc" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - name: FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - run: npx prisma generate
      - name: Migrations match the schema (no forgotten migration)
        if: matrix.shard == 1
        env:
          DATABASE_URL: postgresql://fc:fc@localhost:5432/fcap_test
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code \
            || { echo "::error title=Migration missing::prisma/schema.prisma differs from prisma/migrations — run «npx prisma migrate dev --name <change>» and commit the migration"; exit 1; }
      - name: Integration tests (PostgreSQL + Redis) — shard ${{ matrix.shard }}/3
        run: npm run test:integration -- --shard=${{ matrix.shard }}/3 --reporter=default --reporter=github-actions

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the production image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-ok:
    name: ci-ok
    if: always()
    needs: [build, integration, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All jobs green
        run: |
          echo "build=${{ needs.build.result }} integration=${{ needs.integration.result }} docker=${{ needs.docker.result }}"
          test "${{ needs.build.result }}" = success && test "${{ needs.integration.result }}" = success && test "${{ needs.docker.result }}" = success
