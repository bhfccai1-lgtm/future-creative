# Static security analysis of the TypeScript code (free for public repositories; skipped while the repository is private).
name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 3 * * 1' # weekly, Monday 06:27 Bahrain
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript, queries: security-extended }
      - uses: github/codeql-action/analyze@v3
