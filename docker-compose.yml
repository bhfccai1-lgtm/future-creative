# FUTURE CREATIVE AI PUBLISHING SYSTEM — production stack (Ubuntu 24.04)
# Start:  docker compose up -d --build      (see docs/DEPLOYMENT_UBUNTU.md)
name: future-creative

x-app: &app
  build: .
  image: future-creative-app:latest
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-fc}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fcap}
    REDIS_URL: redis://redis:6379
    LOCAL_STORAGE_DIR: /data/media
    FONT_DIR: /app/assets/fonts
    TZ: Asia/Bahrain
  volumes:
    - media:/data/media
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fcap}
      TZ: Asia/Bahrain
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fc}"], interval: 10s, timeout: 5s, retries: 10 }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 10 }
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx prisma/seed.ts"]
    restart: "no"

  web:
    <<: *app
    command: ["npm", "run", "start"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 30s, timeout: 10s, retries: 5 }
    expose: ["3000"]

  worker:
    <<: *app
    command: ["npm", "run", "worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    stop_grace_period: 60s

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped

  # Optional S3-compatible storage (enable with: docker compose --profile s3 up -d)
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-change-me-please}
    volumes: [minio:/data]
    restart: unless-stopped

volumes: { pgdata: {}, redisdata: {}, media: {}, caddy_data: {}, caddy_config: {}, minio: {} }
