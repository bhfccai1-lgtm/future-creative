# FUTURE CREATIVE AI PUBLISHING SYSTEM — production stack (Ubuntu 24.04)
# Start:  docker compose up -d --build      (see docs/DEPLOYMENT_UBUNTU.md)
name: future-creative

x-app: &app
  build:
    context: .
    args:
      GIT_SHA: ${GIT_SHA:-dev}
      BUILD_TIME: ${BUILD_TIME:-}
  image: future-creative-app:latest
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-fc}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fcap}
    REDIS_URL: redis://redis:6379
    LOCAL_STORAGE_DIR: /data/media
    FONT_DIR: /app/assets/fonts
    TZ: Asia/Bahrain
  volumes:
    - media:/data/media
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fcap}
      TZ: Asia/Bahrain
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fc}"], interval: 10s, timeout: 5s, retries: 10 }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 10 }
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx prisma/seed.ts"]
    restart: "no"

  web:
    <<: *app
    command: ["npm", "run", "start"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 30s, timeout: 10s, retries: 5 }
    expose: ["3000"]

  worker:
    <<: *app
    command: ["npm", "run", "worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    stop_grace_period: 60s

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/sites:/etc/caddy/sites:ro # optional extra sites written by setup scripts (e.g. scripts/freellm.sh)
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped

  # Optional FreeLLMAPI (free provider tiers, OpenAI-compatible) — used by the app ONLY for idea suggestions.
  # Setup: bash scripts/freellm.sh   ·  dashboard: https://ai.${DOMAIN} (behind a password)  ·  app → http://freellmapi:3001/v1
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:v0.9.9 # pinned; no self-update container (it would need the Docker socket)
    profiles: ["freellm"]
    environment:
      NODE_ENV: production
      PORT: "3001"
      ENCRYPTION_KEY: ${FREELLM_ENCRYPTION_KEY:-}
      FREEAPI_BLOCK_PRIVATE_PROVIDER_URLS: "true" # reachable through Caddy → never proxy to internal addresses
    volumes: [freellmapi_data:/app/server/data]
    expose: ["3001"]
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 30s, timeout: 5s, retries: 3 }
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  # Optional n8n automation on the SAME server (no extra server): docker compose --profile n8n up -d
  # Editor: https://n8n.${DOMAIN}  ·  talks to the app internally at http://web:3000 (never leaves the server)
  n8n:
    image: n8nio/n8n:2.35.7 # version the deploy/n8n templates were tested against
    profiles: ["n8n"]
    environment:
      N8N_HOST: n8n.${DOMAIN}
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      WEBHOOK_URL: https://n8n.${DOMAIN}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      GENERIC_TIMEZONE: Asia/Bahrain
      TZ: Asia/Bahrain
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_PROXY_HOPS: "1" # behind Caddy
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      # keep the n8n database small: failed runs are kept, old executions pruned after 14 days
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      # values used by the templates in deploy/n8n (set them in .env)
      FC_API_BASE: http://web:3000
      FC_WEBHOOK_SECRET: ${FC_WEBHOOK_SECRET:-}
      FC_API_TOKEN: ${FC_API_TOKEN:-}
      GDRIVE_FOLDER_ID: ${GDRIVE_FOLDER_ID:-}
      GSHEET_ID: ${GSHEET_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
    volumes: [n8n_data:/home/node/.n8n, ./deploy/n8n:/templates:ro]
    depends_on: [web]
    restart: unless-stopped

  # Optional S3-compatible storage (enable with: docker compose --profile s3 up -d)
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-change-me-please}
    volumes: [minio:/data]
    restart: unless-stopped

volumes: { pgdata: {}, redisdata: {}, media: {}, caddy_data: {}, caddy_config: {}, minio: {}, n8n_data: {}, freellmapi_data: {} }
